<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>UniloanBudget Dashboard</title>
    <link rel="stylesheet" href="styles.css"/>

</head>
<body>
    <header class="topbar">

        <div class="nav-group admin-nav">

            <span class="role">ADMIN</span>
            <a class="nav-current" href="admin_dashboard.html">Dashboard</a>
            <a href="admin_students.html">Students</a>
            <a href="admin_statistics.html">Statistics</a>
        </div>

    </header>

    <div class="app-shell">

        <aside class="sidebar">

            <a class="brand" href="#">UniLoan<span>Budget</span></a>

            <nav class="side-nav">

                <a class="side-current" href="admin_dashboard.html">
                    📊 Dashboard
                </a>

                <a href="admin_students.html">
                    🎓 Students
                </a>

                <a href="admin_statistics.html">
                    📝 Statistics
                </a>

            </nav>

        </aside>

        <main class="content">

            <section class="page-heading">
                <h1>System overview</h1>
                <p id="semester-date"></p>
            </section>

            <section class="metrics">

                <article class="metric-card">
                    <p>Registered students</p>
                    <strong id="registered-students">

                        <!--HERE PHP HAS 
                        TO FETCH DATA 
                        -->
                    </strong>
                </article>

                <article class="metric-card">
                    <p>Active budgets</p>
                    <strong id="active-budgets" class="green">

                        <!--HERE PHP HAS 
                        TO FETCH DATA
                        -->

                    </strong>
                </article>

                <article class="metric-card">
                    <p>Students over budget</p>
                    <strong id="students-over-budget" class="red">
                        <!--HERE PHP HAS 
                        TO FETCH DATA
                        -->

                    </strong>
                </article>

                <article class="metric-card">
                    <p>Avg. remaining balance</p>
                    <strong id="average-balance" class="gold">
                        <!--HERE PHP HAS 
                        TO FETCH DATA
                        -->

                    </strong>

                </article>

            </section>

            <section class="registrations">
                <h2>Recently registered</h2>
                <div class="table-wrap">

                    <table>

                        <thead>

                            <tr>
                                <th>Student</th>
                                <th>University</th>
                                <th>Budget set</th>
                                <th>Status</th>
                            </tr>

                        </thead>

                        <tbody>

                            <!-- PHP will generate 
                            rows of data here -->

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

  </div>

</body>
</html>
