<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
        content="width=device-width", initial-scale="1.0">

    <title>UniLoanBudget Statistics</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>


    <header class="topbar">

        <div class="nav-group admin-nav">

            <span class="role">ADMIN</span>
            <a href="admin_login.html">
                Login
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="students.html">
                Students
            </a>

            <a class="nav-current" href="statistics.html">
                Statistics
            </a>

        </div>
    </header>


    <div class="app-shell">



        <aside class="sidebar">

            <a class="brand" href="#">
                UniLoan<span>Budget</span>
            </a>

            <nav class="side-nav"
                aria-label="Admin navigation">

                <a href="dashboard.html">

                    <span class="nav-icon">📊</span>
                    Dashboard

                </a>

                <a href="students.html">

                    <span class="nav-icon">🎓</span>

                    Students

                </a>

                <a class="side-current"
                        href="statistics.html">

                    <span class="nav-icon">📝</span>

                    Statistics

                </a>

            </nav>

            <div class="sidebar-footer"></div>

        </aside>



        <main class="content">

            <section class="page-heading">

                <h1>Platform statistics</h1>

                <!--
                    PHP/JAVASCRIPT WILL PROVIDE THE CURRENT 
                    SEMESTER AND RELEVANT DATE
                -->

                <p id="statistics-semester-date"></p>

            </section>

            <section class="metrics"
                aria-label="Platform statistics">


                <!--TOTAL REPORTS-->
                <article class="metrics-card">

                    <p>Total reports logged</p>

                    <!--
                        PHP / JAVASCRIPT HERE WILL INSERT THE
                        VALUES FETCHED/CALCULATED FROM THE DATABASE.
                    -->

                    <strong id="total-reports"></strong>

                </article>

                <!--AVERAGE CATEGORY OVERRUNS-->

                <article class="metrics-card">

                    <p>Avg. category over-runs</p>

                    <!--
                        PHP/JAVASCRIPT WILL INSERT 
                        THE CALCULATED VALUE HERE
                    -->

                    <strong id="avg-overruns"></strong>

                </article>

                <!--MOST STRAINED CATEGORY-->
                <article class="metric-card">

                    <p>Most-strained category</p>

                    <!--
                        PHP/ JAVASCRIPT WILL DETERMINE
                        AND INSERT THE CATEGORY HERE.
                    -->

                    <strong id="strained-category" 
                        class="red">
                    </strong>

                </article>

                <!--AVERAGE DAYS BUDGET LASTS-->

                <article class="metrics-card">

                    <p>Avg. days budget lasts</p>

                    <!--
                        PHP/ JAVASCRIPT WILL CALCULATE 
                        AND INSERT THE VALUE HERE.
                    -->

                    <strong id="avg-days"
                        class="gold">
                    </strong>

                </article>

            </section>

            <section class="registrations">

                <h2>Average spend by category [<i>chart</i>]</h2>

                <div class="table-wrap">

                    <table>
                        
                        <!--TABLE BODY-->
                        <tbody id="category-statistics-body">

                            <!--
                                PHP/ JAVASCRIPT WILL EVENTUALLY 
                                GENERATE THE CATEGORY ROWS FROM 
                                THE DATABASE.
                                IS LIKE HISTOGRAM FULANI HIVI 
                                INAYOONESHA CHART YA MATUMIZI
                                YA KILA CATEGORY
                            -->

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

</body>

</html>
