<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - UniLoanBudget</title>

    <link rel="stylesheet" href="project.css">
</head>

<body>
    <!-- LOGIN AREA -->
    <div class="login-page">

        <!-- LEFT SIDE -->
        <div class="login-left">

            <h1>
                Uni<span>Loan</span>Budget
            </h1>

            <div class="student-message">

                <p>
                    "i finally know what's <br>left before rent is due--<br> not after."
                </p>

            </div>

            <div class="bottom-text">
            ---student at Dodoma university--- 
            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="login-right">

            <div class="login-box">

                <!-- STUDENT / ADMIN -->
                <div class="login-switch">

                    <a href="login.html">
                      create new account  
                    </a>

                    <a href="student-login.html" class="selected">
                        LogIn
                    </a>

                </div>


                <!-- USERNAME -->
                <label for="username">username </label>

                <input
                    type="text"
                    id="username"
                    placeholder="student username"
                >


                <!-- PASSWORD -->
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                >


                <!-- LOGIN BUTTON -->
                <button type="button">
                    Log in
                </button>
                <p class="student-note">
                    Are you new here? <a href="create new account.html">create new account </a></p>
            </div>

        </div>
</div>




</body>
</html>
